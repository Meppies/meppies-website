<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="wrap nav" aria-label="Main">
    <a href="{{ '/' | relative_url }}" class="brand"><img src="{{ '/assets/img/meppie-mark.svg' | relative_url }}" alt="" width="36" height="36" /><span>meppie<span class="dot">.</span>eu</span></a>
    <div class="nav-links">
      {% for item in site.navigation %}
        {% assign item_url = item.url | append: '/' %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item_url or page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="rss" href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </nav>
</header>
